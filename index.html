<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="calculator.js"></script>
  <script defer src="renderer.js"></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="titlebar">
      <div class="window-controls">
        <button class="window-control close" data-window="close" aria-label="Close window" title="Close">×</button>
        <button class="window-control minimize" data-window="minimize" aria-label="Minimize window" title="Minimize">−</button>
        <span class="window-control inactive" aria-hidden="true"></span>
      </div>
      <span class="app-title">Calculator</span>
    </header>
    <section class="screen" aria-label="Calculation result">
      <div class="expression" id="expression" aria-hidden="true"></div>
      <output id="display" class="calc-display" aria-live="polite" aria-atomic="true">0</output>
    </section>
    <div class="keypad" aria-label="Calculator keypad">
      <button class="calc-button utility" data-action="clear" title="Clear all (Escape)">AC</button>
      <button class="calc-button utility" data-action="sign" aria-label="Change sign" title="Change sign (F9)">±</button>
      <button class="calc-button utility" data-action="percent" aria-label="Percent" title="Percent (%)">%</button>
      <button class="calc-button operator" data-operator="/" aria-label="Divide">÷</button>
      <button class="calc-button" data-number="7">7</button>
      <button class="calc-button" data-number="8">8</button>
      <button class="calc-button" data-number="9">9</button>
      <button class="calc-button operator" data-operator="*" aria-label="Multiply">×</button>
      <button class="calc-button" data-number="4">4</button>
      <button class="calc-button" data-number="5">5</button>
      <button class="calc-button" data-number="6">6</button>
      <button class="calc-button operator" data-operator="-" aria-label="Subtract">−</button>
      <button class="calc-button" data-number="1">1</button>
      <button class="calc-button" data-number="2">2</button>
      <button class="calc-button" data-number="3">3</button>
      <button class="calc-button operator" data-operator="+" aria-label="Add">+</button>
      <button class="calc-button zero" data-number="0">0</button>
      <button class="calc-button" data-number="." aria-label="Decimal point">.</button>
      <button class="calc-button operator equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>
</body>
</html>
