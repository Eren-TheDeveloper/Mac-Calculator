    <text x="79" y="37" text-anchor="end" fill="#fff3e6" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="300">42</text>
    <g fill="#bba6c2">
      <rect x="12" y="56" width="20" height="24" rx="5"/>
      <rect x="39" y="56" width="20" height="24" rx="5"/>
