  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#302637"/>
      <stop offset="1" stop-color="#604867"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffbb65"/>
      <stop offset="1" stop-color="#f49b38"/>
    </linearGradient>
  </defs>
  <rect width="880" height="264" rx="20" fill="url(#background)"/>
  <circle cx="838" cy="22" r="158" fill="#b79abd" opacity=".06"/>
  <circle cx="838" cy="22" r="114" fill="none" stroke="#ead9ef" stroke-opacity=".09"/>
  <circle cx="35" cy="270" r="108" fill="none" stroke="#ead9ef" stroke-opacity=".08"/>
  <g transform="translate(64 67)">
    <rect x="0" y="5" width="100" height="130" rx="19" fill="#211925" opacity=".28"/>
